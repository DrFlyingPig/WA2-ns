name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test-core:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build headless core tests
        run: |
          g++ -std=c++17 -O1 -Wall -Isrc \
            tests/test_core.cpp \
            src/wa2/util.cpp src/wa2/archive.cpp src/wa2/res.cpp \
            src/wa2/script.cpp src/wa2/funcs.cpp src/wa2/state.cpp \
            src/wa2/sjis.cpp src/wa2/sjis_table.cpp \
            -o test_core
      - name: Generate demo data
        run: |
          python3 -m pip install --quiet pillow numpy
          python3 tools/gen_demo.py
      - name: Run tests
        run: ./test_core out/Wa2Res

  linux:
    name: PC build (Linux, SDL2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libsdl2-mixer-dev
      - name: Build
        run: make -f Makefile.pc

  switch:
    name: Switch build (devkitPro)
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build wa2.nro
        run: python3 tools/build_switch.py --devkitpro "$DEVKITPRO"
      - name: Verify native framebuffer build
        run: |
          test "$(stat -c%s wa2.nro)" -lt 6000000
          ! "$DEVKITPRO/devkitA64/bin/aarch64-none-elf-strings" wa2.elf \
            | grep -E 'nv50_ir|nouveau_switch|_mesa_glsl'
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wa2-switch
          path: |
            wa2.nro
          if-no-files-found: error
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: wa2.nro
